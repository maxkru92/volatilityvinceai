name: regenerate-favicons
# Auto-regenerates the favicon pack on every push to main.
# PREREQUISITES:
#   - Repo var KC_FAVICON_PACK_REPO (e.g. https://github.com/krupp-capital/kc-favicon-pack)
#     OR set Repo secret KC_FAVICON_PACK_PAT (a PAT with read on the pack repo).
#   - If your default branch requires PR-review protections, the auto-push will
#     fail. Either disable that protection OR add Repo secret KC_REGENERATE_PAT
#     (a PAT with write to this repo) and the workflow will pick it up.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout site repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.KC_REGENERATE_PAT || secrets.GITHUB_TOKEN }}

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: fetch kc-favicon-pack
        id: pack
        env:
          KC_FAVICON_PACK_REPO: ${{ vars.KC_FAVICON_PACK_REPO }}
          KC_FAVICON_PACK_PAT:  ${{ secrets.KC_FAVICON_PACK_PAT }}
          KC_FAVICON_PACK_DIR:  ${{ vars.KC_FAVICON_PACK_DIR }}
        run: |
          if [ -n "$KC_FAVICON_PACK_REPO" ]; then
            URL="$KC_FAVICON_PACK_REPO"
            [ -n "$KC_FAVICON_PACK_PAT" ] && URL="https://x-access-token:${KC_FAVICON_PACK_PAT}@${KC_FAVICON_PACK_REPO#https://}"
            git clone --depth=1 "$URL" /tmp/kc-favicon-pack
            echo "dir=/tmp/kc-favicon-pack" >> "$GITHUB_OUTPUT"
          elif [ -n "$KC_FAVICON_PACK_DIR" ] && [ -d "$KC_FAVICON_PACK_DIR" ]; then
            echo "dir=$KC_FAVICON_PACK_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::KC_FAVICON_PACK_REPO / KC_FAVICON_PACK_DIR not set; cannot fetch upstream"
            exit 1
          fi

      - name: regenerate favicon pack
        env:
          PACK_DIR: ${{ steps.pack.outputs.dir }}
        run: |
          ALIAS=volatilityvinceai
          VARIANT=cyan
          [ "$VARIANT" = "dark" ] && FLAG="--light-mode=paths" || FLAG=""
          python3 "$PACK_DIR/deploy.py" --sites="$ALIAS" $FLAG

      - name: commit + push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain -- public/)" ]; then
            git add -A
            git commit -m 'chore: regenerate favicon pack [skip ci]'
            git push
          else
            echo "no public/ changes; nothing to push"
          fi
